<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shakiba, Do You Love Me?</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --blush:    #f9d6e3;
      --rose:     #e8a0b8;
      --petal:    #fce8f0;
      --cream:    #fffaf8;
      --mauve:    #c97da0;
      --deep:     #8b4a6a;
      --text:     #5c2d48;
      --soft:     #f3c6d8;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: var(--cream);
      font-family: 'Lora', serif;
      color: var(--text);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* ── Mesh background ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%,  #fde4ef 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 90%,  #f9d6e8 0%, transparent 55%),
        radial-gradient(ellipse 50% 70% at 70% 15%,  #fce8f5 0%, transparent 50%),
        radial-gradient(ellipse 40% 40% at 10% 80%,  #f5d0e6 0%, transparent 55%);
      z-index: 0;
    }

    /* ── Floating hearts canvas ── */
    #hearts-bg {
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    /* ── Card ── */
    .card {
      position: relative;
      z-index: 10;
      background: rgba(255, 250, 252, 0.72);
      backdrop-filter: blur(18px) saturate(1.4);
      -webkit-backdrop-filter: blur(18px) saturate(1.4);
      border: 1.5px solid rgba(232, 160, 184, 0.35);
      border-radius: 32px;
      padding: 56px 52px 52px;
      max-width: 480px;
      width: 92%;
      text-align: center;
      box-shadow:
        0 8px 32px rgba(201, 125, 160, 0.14),
        0 2px 8px  rgba(201, 125, 160, 0.08),
        inset 0 1px 0 rgba(255,255,255,0.9);
      animation: floatCard 6s ease-in-out infinite;
    }

    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-8px); }
    }

    /* ── Decorative ring ── */
    .card::before {
      content: '';
      position: absolute;
      top: -1px; left: -1px; right: -1px; bottom: -1px;
      border-radius: 33px;
      background: linear-gradient(135deg, rgba(249,214,227,0.6) 0%, transparent 50%, rgba(232,160,184,0.4) 100%);
      z-index: -1;
    }

    /* ── Bear / icon ── */
    .bear {
      font-size: 0;
      margin-bottom: 20px;
    }
    .bear svg {
      width: 80px; height: 80px;
      filter: drop-shadow(0 4px 12px rgba(201,125,160,0.3));
      animation: bearBounce 2.4s ease-in-out infinite;
    }
    @keyframes bearBounce {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50%       { transform: translateY(-6px) rotate(3deg); }
    }

    /* ── Headline ── */
    h1 {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(1.45rem, 4vw, 1.9rem);
      color: var(--deep);
      line-height: 1.35;
      margin-bottom: 10px;
      letter-spacing: 0.01em;
    }
    h1 span {
      color: var(--mauve);
      white-space: nowrap;
    }

    .subtitle {
      font-size: 0.82rem;
      color: var(--rose);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 36px;
      opacity: 0.85;
    }

    /* ── Petal divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
      margin-bottom: 36px;
    }
    .divider span { flex: 1; height: 1px; background: linear-gradient(to right, transparent, var(--rose), transparent); opacity: 0.5; }
    .divider svg { width: 18px; height: 18px; color: var(--mauve); }
    
    /* ── Buttons ── */
    .btn-group {
      display: flex;
      gap: 16px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn-yes {
      position: relative;
      padding: 14px 38px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, var(--mauve) 0%, #d4659a 100%);
      color: #fff;
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      font-style: italic;
      letter-spacing: 0.04em;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(180, 80, 130, 0.35), 0 2px 6px rgba(180,80,130,0.2);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      overflow: hidden;
    }
    .btn-yes::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.22) 0%, transparent 60%);
      border-radius: inherit;
    }
    .btn-yes:hover {
      transform: translateY(-3px) scale(1.04);
      box-shadow: 0 10px 28px rgba(180,80,130,0.45), 0 4px 10px rgba(180,80,130,0.25);
    }
    .btn-yes:active { transform: scale(0.97); }

    .btn-no {
      position: fixed;
      padding: 13px 34px;
      border-radius: 999px;
      border: 1.5px solid var(--rose);
      background: rgba(255,255,255,0.65);
      color: var(--mauve);
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      font-style: italic;
      letter-spacing: 0.04em;
      cursor: pointer;
      box-shadow: 0 3px 12px rgba(201,125,160,0.15);
      transition: border-color 0.2s, color 0.2s;
      z-index: 99;
      white-space: nowrap;
    }

    /* ── Yes screen ── */
    #yes-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      animation: fadeIn 0.6s ease both;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

    #yes-screen h2 {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: clamp(1.5rem, 4.5vw, 2rem);
      color: var(--deep);
      line-height: 1.3;
    }
    #yes-screen p {
      font-size: 0.9rem;
      color: var(--mauve);
      opacity: 0.9;
    }
    #yes-screen .big-heart svg {
      width: 90px; height: 90px;
      animation: heartbeat 0.9s ease-in-out infinite;
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      14%       { transform: scale(1.18); }
      28%       { transform: scale(1); }
      42%       { transform: scale(1.12); }
      70%       { transform: scale(1); }
    }

    /* ── No counter message ── */
    #no-msg {
      margin-top: 8px;
      font-size: 0.8rem;
      color: var(--rose);
      min-height: 1.2em;
      opacity: 0;
      transition: opacity 0.4s;
    }
    #no-msg.show { opacity: 1; }

    /* ── Sparkle particles ── */
    .sparkle {
      position: fixed;
      pointer-events: none;
      z-index: 200;
      border-radius: 50%;
      animation: sparkleFade 0.8s ease forwards;
    }
    @keyframes sparkleFade {
      0%   { opacity: 1; transform: scale(1) translateY(0); }
      100% { opacity: 0; transform: scale(0) translateY(-40px); }
    }
  </style>
</head>
<body>

<canvas id="hearts-bg"></canvas>

<div class="card" id="main-card">

  <!-- Question view -->
  <div id="question-view">
    <div class="bear">
      <!-- Cute bear SVG -->
      <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- ears -->
        <circle cx="28" cy="28" r="14" fill="#f4bdd0"/>
        <circle cx="72" cy="28" r="14" fill="#f4bdd0"/>
        <circle cx="28" cy="28" r="9"  fill="#e8a0b8"/>
        <circle cx="72" cy="28" r="9"  fill="#e8a0b8"/>
        <!-- head -->
        <ellipse cx="50" cy="56" rx="32" ry="30" fill="#f9d6e3"/>
        <!-- eyes -->
        <ellipse cx="40" cy="50" rx="4" ry="4.5" fill="#5c2d48"/>
        <ellipse cx="60" cy="50" rx="4" ry="4.5" fill="#5c2d48"/>
        <circle cx="41.5" cy="48.5" r="1.4" fill="white"/>
        <circle cx="61.5" cy="48.5" r="1.4" fill="white"/>
        <!-- nose -->
        <ellipse cx="50" cy="59" rx="5" ry="3.5" fill="#c97da0"/>
        <!-- mouth -->
        <path d="M44 63 Q50 68 56 63" stroke="#c97da0" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <!-- rosy cheeks -->
        <ellipse cx="33" cy="62" rx="6" ry="4" fill="#f0a8c4" opacity="0.5"/>
        <ellipse cx="67" cy="62" rx="6" ry="4" fill="#f0a8c4" opacity="0.5"/>
        <!-- small heart on forehead -->
        <path d="M47 37 C47 35 50 33 50 37 C50 33 53 35 53 37 C53 39.5 50 42 50 42 C50 42 47 39.5 47 37Z" fill="#d4659a"/>
      </svg>
    </div>

    <h1>Shakiba,<br/><span>do you love me?</span></h1>
    <p class="subtitle">A question from the heart</p>

    <div class="divider">
      <span></span>
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      <span></span>
    </div>

    <div class="btn-group">
      <button class="btn-yes" id="btn-yes" onclick="handleYes()">Yes, of course!</button>
      <button class="btn-no"  id="btn-no"  onclick="handleNo()">No...</button>
    </div>

    <p id="no-msg"></p>
  </div>

  <!-- Yes screen -->
  <div id="yes-screen">
    <div class="big-heart">
      <svg viewBox="0 0 100 90" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 82 C50 82 8 54 8 28 C8 14 18 4 32 4 C40 4 47 8 50 14 C53 8 60 4 68 4 C82 4 92 14 92 28 C92 54 50 82 50 82Z" fill="url(#hg)"/>
        <defs>
          <linearGradient id="hg" x1="8" y1="4" x2="92" y2="82" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#f4a0c0"/>
            <stop offset="100%" stop-color="#c95585"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <h2>I knew it!</h2>
    <p>You just made the happiest person smile forever.</p>
    <p style="margin-top:6px; color:var(--deep); font-style:italic; font-size:0.88rem;">-- With all my love --</p>
  </div>

</div>

<!-- Floating No button (starts positioned) -->
<script>
  // Position the No button near the card initially
  document.addEventListener('DOMContentLoaded', function() {
    const btn = document.getElementById('btn-no');
    btn.style.left = '52%';
    btn.style.top  = '58%';
    btn.style.transform = 'translate(-50%, -50%)';
  });
</script>

<script>
  /* ── Floating hearts canvas ── */
  (function() {
    const canvas = document.getElementById('hearts-bg');
    const ctx    = canvas.getContext('2d');
    const hearts = [];
    const COLORS = ['#f9a8c9','#f4bdd0','#e8a0b8','#fce8f0','#d4659a','#c97da0'];

    function resize() {
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    for (let i = 0; i < 22; i++) {
      hearts.push({
        x:    Math.random() * canvas.width,
        y:    Math.random() * canvas.height,
        size: 8 + Math.random() * 18,
        vx:   (Math.random() - 0.5) * 0.4,
        vy:   -0.3 - Math.random() * 0.5,
        alpha:0.12 + Math.random() * 0.18,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        rot:  Math.random() * Math.PI * 2,
        vr:   (Math.random() - 0.5) * 0.015,
      });
    }

    function drawHeart(x, y, s, rot, alpha, color) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(x, y);
      ctx.rotate(rot);
      ctx.beginPath();
      ctx.moveTo(0, s * 0.3);
      ctx.bezierCurveTo(-s * 0.8, -s * 0.2, -s, -s * 0.9, 0, -s * 0.5);
      ctx.bezierCurveTo( s,       -s * 0.9,  s * 0.8, -s * 0.2, 0, s * 0.3);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.restore();
    }
    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      hearts.forEach(h => {
        h.x  += h.vx;
        h.y  += h.vy;
        h.rot += h.vr;
        if (h.y + h.size < 0)   { h.y = canvas.height + h.size; h.x = Math.random() * canvas.width; }
        if (h.x + h.size < 0)   h.x = canvas.width  + h.size;
        if (h.x - h.size > canvas.width) h.x = -h.size;
        drawHeart(h.x, h.y, h.size, h.rot, h.alpha, h.color);
      });
      requestAnimationFrame(loop);
    }
    loop();
  })();

  /* ── No button escape logic ── */
  const noBtn    = document.getElementById('btn-no');
  const noMsgs   = [
    "Too slow!",
    "Hmm, are you sure?",
    "Think again...",
    "Catch me if you can!",
    "That's not an option!",
    "You know the answer...",
    "Try the other button!",
    "I believe in you!",
  ];
  let noCount = 0;

  function moveNoBtn() {
    const margin = 80;
    const maxX   = window.innerWidth  - noBtn.offsetWidth  - margin;
    const maxY   = window.innerHeight - noBtn.offsetHeight - margin;
    const newX   = margin + Math.random() * maxX;
    const newY   = margin + Math.random() * maxY;
    noBtn.style.left      = newX + 'px';
    noBtn.style.top       = newY + 'px';
    noBtn.style.transform = 'none';
    noBtn.style.transition = 'left 0.18s cubic-bezier(.4,0,.2,1), top 0.18s cubic-bezier(.4,0,.2,1)';
  }

  noBtn.addEventListener('mouseenter', moveNoBtn);
  noBtn.addEventListener('touchstart',  function(e) {
    e.preventDefault();
    moveNoBtn();
    noCount++;
    const msg = document.getElementById('no-msg');
    if (!msg) return;
    msg.textContent = noMsgs[Math.min(noCount - 1, noMsgs.length - 1)];
    msg.classList.add('show');
  });

  function handleNo() {
    moveNoBtn();
    noCount++;
    const msg = document.getElementById('no-msg');
    if (!msg) return;
    msg.textContent = noMsgs[Math.min(noCount - 1, noMsgs.length - 1)];
    msg.classList.add('show');
  }

  /* ── Yes handler ── */
  function handleYes() {
    document.getElementById('question-view').style.display = 'none';
    noBtn.style.display = 'none';
    const ys = document.getElementById('yes-screen');
    ys.style.display = 'flex';
    launchSparkles();
    launchSparkles();
    setTimeout(launchSparkles, 300);
    setTimeout(launchSparkles, 600);
  }

  /* ── Sparkle burst ── */
  function launchSparkles() {
    const colors = ['#f4a0c0','#d4659a','#fce8f0','#c97da0','#f9d6e3','#fff0f5'];
    for (let i = 0; i < 18; i++) {
      const el = document.createElement('div');
      el.className = 'sparkle';
      const size = 6 + Math.random() * 8;
      el.style.cssText = `
        width: ${size}px;
        height: ${size}px;
        background: ${colors[Math.floor(Math.random() * colors.length)]};
        left: ${20 + Math.random() * 60}vw;
        top: ${20 + Math.random() * 60}vh;
        animation-duration: ${0.6 + Math.random() * 0.6}s;
        animation-delay: ${Math.random() * 0.3}s;
      `;
      document.body.appendChild(el);
      el.addEventListener('animationend', () => el.remove());
    }
  }
</script>
</body>
</html>
